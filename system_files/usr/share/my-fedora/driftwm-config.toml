# driftwm config for new users: upstream extras "home dashboard" rice + our additions.
# Every option: /etc/driftwm/config.reference.toml. Partial configs merge with defaults.
# XDG autostart (polkit agent, blueman applet) starts on its own.

autostart = [
    "swaync",                                      # notifications
    "swayosd-server --top-margin 0.95",            # volume/brightness OSD
    "qs -p ~/.config/driftwm/quickshell",          # home dashboard: battery, Wi-Fi, BT, sound, power menu
    "~/.config/driftwm/scripts/battery_notify.sh", # low-battery alert
    "wl-paste --watch cliphist store",             # clipboard history
    "wlsunset -l 55.7 -L 37.6",                    # night light; -l/-L = latitude/longitude (Moscow)
    "kanshi",                                      # monitor profiles: ~/.config/kanshi/config
    # lock after 5 min, screen off after 5.5, suspend after 15; always lock before sleep
    "swayidle -w timeout 300 'swaylock -f' timeout 330 \"wlopm --off '*'\" resume \"wlopm --on '*'\" timeout 900 'systemctl suspend' before-sleep 'swaylock -f'",
]

# Sloppy focus: windows don't overlap, so a cursor over a window is deliberate.
focus_follows_mouse = true

[navigation]
# The origin, where the dashboard sits, is a navigation target even with no window there.
anchors = [[0, 0]]

[input.keyboard]
layout = "us,ru"
# Switching is the alt+shift tap binding below: the XKB grp:alt_shift_toggle option would break alt+shift drags

[keybindings]
"alt+shift" = "switch-layout next"             # fires on release, so alt+shift+drag still works
"mod+n" = "spawn swaync-client -t"
"mod+d" = "exec ~/.config/driftwm/scripts/spotlight.sh"
"mod+v" = "spawn cliphist list | fuzzel --dmenu | cliphist decode | wl-copy"
"Print" = "spawn grim -g \"$(slurp)\" - | swappy -f -"  # area -> editor (ShareX-like); shift+Print: area to clipboard
"ctrl+print" = "spawn driftwm msg screenshot window -o - | wl-copy"
"XF86AudioRaiseVolume" = "spawn swayosd-client --output-volume raise"
"XF86AudioLowerVolume" = "spawn swayosd-client --output-volume lower"
"XF86AudioMute" = "spawn swayosd-client --output-volume mute-toggle"
"XF86MonBrightnessUp" = "spawn swayosd-client --brightness raise"
"XF86MonBrightnessDown" = "spawn swayosd-client --brightness lower"
"mod+alt+shift+q" = "exec systemctl poweroff"

# The home dashboard, pinned at the canvas origin
[[window_rules]]
app_id = "drift-dashboard"
position = [0, 0]
widget = true

# Frost the transient shell overlays
[[window_rules]]
app_id = "swaync-control-center"
blur = true

[[window_rules]]
app_id = "swaync-notification-window"
blur = true

[[window_rules]]
app_id = "launcher"
blur = true

[[window_rules]]
app_id = "swayosd"
blur = true
