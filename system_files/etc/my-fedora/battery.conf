# ThinkPad battery charge thresholds used by my-fedora-battery.service.
# start = resume charging below this level, end = stop charging at this level.
#
# Presets: main 75/80, longevity 40/80, travel 95/100.
# Change without rebuilding the image:
#   sudo my-fedora-battery profile travel
#   sudo my-fedora-battery set --start 60 --end 85
#
# GNOME users: Settings -> Power -> Preserve Battery Health also changes the
# same UPower value. Use one mechanism or the other, not both.
CHARGE_START=75
CHARGE_END=80
