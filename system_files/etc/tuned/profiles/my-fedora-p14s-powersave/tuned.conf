# Power Saver for the ThinkPad P14s Gen 2 AMD.
#
# This is intentionally a standalone profile instead of including the stock
# "powersave": that profile's script enables Wi-Fi power saving and (when
# USB_AUTOSUSPEND=1) autosuspend on every USB device, which is a common cause
# of dropped connections and dead HID. Enable those only after testing on the
# actual adapter:
#   sudo iw dev wlan0 set power_save on
#   echo 1 | sudo tee /sys/bus/usb/devices/*/power/control
#
# CPU: EPP=power and the low-power ACPI platform profile, but boost stays on so
# the laptop does not become sluggish. No frequencies are pinned.
[main]
summary=ThinkPad P14s Gen 2 AMD: power saver (no Wi-Fi/USB autosuspend)
include=balanced

[acpi]
platform_profile=low-power|quiet

[cpu]
governor=schedutil|powersave
energy_performance_preference=power
boost=1

[audio]
timeout=10

[video]
radeon_powersave=dpm-battery, auto
panel_power_savings=3

[scsi_host]
alpm=med_power_with_dipm

[sysctl]
vm.dirty_writeback_centisecs=1500
kernel.nmi_watchdog=0
