# Power Profiles Daemon -> TuneD mapping for the ThinkPad P14s Gen 2 AMD.
# tuned-ppd owns the net.hadess.PowerProfiles D-Bus API, so GNOME Settings and
# `my-fedora-power-profile` (DriftWM) drive the same three profiles.
#
# The custom profiles include the stock TuneD ones and only override what this
# laptop needs; see all of them in /etc/tuned/profiles/my-fedora-p14s-*.
[main]
# The default PPD profile
default=balanced
battery_detection=true
sysfs_acpi_monitor=true

[profiles]
power-saver=my-fedora-p14s-powersave
balanced=my-fedora-p14s-balanced
performance=my-fedora-p14s-performance

[battery]
balanced=my-fedora-p14s-balanced-battery
