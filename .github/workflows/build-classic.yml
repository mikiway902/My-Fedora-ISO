---
name: Build classic ISO

# Classic Fedora (Anaconda/dnf) netinstall ISOs, built alongside the atomic ones.
# The source media is Fedora Everything; packages come from Fedora, RPM Fusion
# and COPR during installation.

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "Which classic ISO to build"
        required: true
        default: both
        type: choice
        options:
          - both
          - gnome
          - driftwm
      hardware_profile:
        description: "Hardware profile (desktop-nvidia builds GNOME only)"
        required: true
        default: generic
        type: choice
        options:
          - generic
          - desktop-nvidia
  schedule:
    # Weekly unattended check that the kickstart still resolves against Fedora
    - cron: '20 4 * * 6'  # Saturday 04:20 UTC
  push:
    branches:
      - main
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}-${{ inputs.variant || 'both' }}-${{ inputs.hardware_profile || 'generic' }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.variant }} ${{ matrix.hardware_profile }} classic ISO
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(github.ref == 'refs/heads/main' && github.event_name == 'push' && '["gnome"]' || inputs.hardware_profile == 'desktop-nvidia' && '["gnome"]' || inputs.variant == 'gnome' && '["gnome"]' || inputs.variant == 'driftwm' && '["driftwm"]' || '["gnome","driftwm"]') }}
        hardware_profile: ${{ fromJSON(github.ref == 'refs/heads/main' && github.event_name == 'push' && '["generic","desktop-nvidia"]' || inputs.hardware_profile == 'desktop-nvidia' && '["desktop-nvidia"]' || '["generic"]') }}
    permissions:
      contents: read
    env:
      VARIANT: ${{ matrix.variant }}
      HARDWARE_PROFILE: ${{ matrix.hardware_profile }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Install podman and ISO tools
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y podman xorriso file python3

      - name: Configure rootful Podman storage
        run: |
          sudo rm -rf /var/lib/containers/storage
          sudo mkdir -p /var/lib/containers/storage /etc/containers
          printf '[storage]\ndriver = "overlay"\nrunroot = "/run/containers/storage"\ngraphroot = "/var/lib/containers/storage"\n' \
            | sudo tee /etc/containers/storage.conf > /dev/null

      - name: Check Justfile syntax
        run: just check

      - name: Check Fedora repositories (blocking)
        shell: bash
        run: |
          set +e
          bash build_files/check-repos.sh
          rc=$?
          set -e
          if (( rc != 0 )); then
            echo "::error::Fedora repository check failed (exit ${rc}); refusing to build/publish an unverified ISO."
            exit "${rc}"
          fi

      - name: Build classic ISO
        # Rootful on purpose: the driftwm build stage and mkksiso run in podman
        run: sudo env "PATH=${PATH}" "VARIANT=${VARIANT}" "HARDWARE_PROFILE=${HARDWARE_PROFILE}" just build-classic-iso

      - name: Fix output ownership
        run: sudo chown -R "$(id -u):$(id -g)" output

      - name: Verify ISO, rename and checksum
        shell: bash
        run: |
          set -euo pipefail

          profile_suffix=
          [[ "${HARDWARE_PROFILE}" == generic ]] || profile_suffix="-${HARDWARE_PROFILE}"
          artifact_variant="${VARIANT}${profile_suffix}"
          echo "ARTIFACT_VARIANT=${artifact_variant}" >> "$GITHUB_ENV"
          src="output/bootiso/my-fedora-classic-${artifact_variant}.iso"
          dir="artifacts/classic-${artifact_variant}"
          iso="${dir}/my-fedora-classic-${artifact_variant}.iso"
          mkdir -p "${dir}"

          test -f "${src}" || { echo "::error::${src} was not produced"; exit 1; }
          test -s "${src}" || { echo "::error::${src} is empty"; exit 1; }

          bash build_files/check-classic-iso.sh "${src}" "${VARIANT}" \
            --expected-ks "output/classic/${artifact_variant}/${VARIANT}.ks" \
            --payload-dir "output/classic/${artifact_variant}"

          mv "${src}" "${iso}"

          bytes=$(stat -c %s "${iso}")
          echo "ISO size: ${bytes} bytes"
          if (( bytes < 1073741824 )); then
            echo "::error::${iso} is too small to be a bootable Fedora ISO"
            exit 1
          fi

          ( cd "${dir}" && sha256sum "my-fedora-classic-${artifact_variant}.iso" > SHA256SUMS.txt )
          ( cd "${dir}" && sha256sum -c SHA256SUMS.txt )

          # Repro metadata and the exact kickstart/package lists used
          bash build_files/build-info.sh "classic-${artifact_variant}" "${iso}" > "${dir}/build-info.txt"
          cp "output/classic/${artifact_variant}/${VARIANT}.ks" "${dir}/"
          cp "output/classic/${artifact_variant}/packages.sh" "${dir}/"

          ls -lh "${dir}"

      - name: Upload ISO and checksum to job artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: classic-${{ env.ARTIFACT_VARIANT }}-iso
          path: artifacts/classic-${{ env.ARTIFACT_VARIANT }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          overwrite: true
