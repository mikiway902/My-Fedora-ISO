---
name: Build disk images

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "Which ISO to build"
        required: true
        default: both
        type: choice
        options:
          - both
          - gnome
          - driftwm
      upload-to-s3:
        description: "Also upload the ISO to S3 (needs S3_* repository secrets)"
        required: false
        default: false
        type: boolean
  pull_request:
    branches:
      - main
    paths:
      - 'disk_config/disk.toml'
      - 'disk_config/iso-*.toml'
      - '.github/workflows/build-disk.yml'

concurrency:
  # Separate group per variant so gnome and driftwm manual runs can proceed side by side
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}-${{ inputs.variant }}
  # Queue instead of cancelling: a manual gnome run must not kill a driftwm run
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.variant }} ISO
    # ubuntu-26.04 (kernel 7.0) fails osbuild open_tree(OPEN_TREE_CLONE) with EPERM;
    # ubuntu-24.04 (kernel 6.17) is the runner where bootc-image-builder works
    # https://github.com/osbuild/osbuild/issues/2579
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      # One variant failing must not cancel the other
      fail-fast: false
      matrix:
        # workflow_dispatch picks one variant; pull_request (empty input) builds both
        variant: ${{ fromJSON(inputs.variant == 'gnome' && '["gnome"]' || inputs.variant == 'driftwm' && '["driftwm"]' || '["gnome","driftwm"]') }}
    permissions:
      contents: read
    env:
      VARIANT: ${{ matrix.variant }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Install podman and ISO tools
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y podman xorriso file

      - name: Configure rootful Podman storage for bootc-image-builder
        # Same workaround the official bootc-image-builder-action applies on GitHub runners
        run: |
          sudo rm -rf /var/lib/containers/storage
          sudo mkdir -p /var/lib/containers/storage /etc/containers
          printf '[storage]\ndriver = "overlay"\nrunroot = "/run/containers/storage"\ngraphroot = "/var/lib/containers/storage"\n' \
            | sudo tee /etc/containers/storage.conf > /dev/null

      - name: Check Justfile syntax
        run: just check

      - name: Allow root git access to the workspace
        # just build writes OCI labels from `git status`/HEAD, and it runs as root below
        run: sudo git config --global --add safe.directory "${GITHUB_WORKSPACE}"

      - name: Build container image
        # Rootful podman on purpose: bootc-image-builder below reads /var/lib/containers/storage
        run: sudo env "PATH=${PATH}" "VARIANT=${VARIANT}" just build

      - name: Build ISO
        run: |
          set -euxo pipefail
          sudo env "PATH=${PATH}" "VARIANT=${VARIANT}" just build-iso
          sudo chown -R "$(id -u):$(id -g)" output

      - name: Verify ISO, rename and checksum
        shell: bash
        run: |
          set -euo pipefail

          src="output/bootiso/install.iso"
          dir="artifacts/${VARIANT}"
          iso="${dir}/my-fedora-iso-${VARIANT}.iso"
          mkdir -p "${dir}"

          test -f "${src}" || { echo "::error::${src} was not produced"; exit 1; }
          test -s "${src}" || { echo "::error::${src} is empty"; exit 1; }
          test "${iso##*.}" = "iso"

          mv "${src}" "${iso}"

          bytes=$(stat -c %s "${iso}")
          echo "ISO size: ${bytes} bytes"
          # A real Fedora Anaconda ISO is several GiB; this catches truncated output
          if (( bytes < 1073741824 )); then
            echo "::error::${iso} is too small to be a bootable Fedora ISO"
            exit 1
          fi

          # Readable and ISO9660 primary volume descriptor ("CD001" at sector 16)
          dd if="${iso}" of=/dev/null bs=1M count=64 status=none
          test "$(dd if="${iso}" bs=1 skip=32769 count=5 status=none)" = "CD001"
          file "${iso}" | grep -q 'ISO 9660'

          # Boot catalog and installer payload, not just a valid filesystem
          boot=$(xorriso -indev "${iso}" -report_el_torito plain 2>&1) || {
            echo "${boot}"
            echo "::error::xorriso could not read ${iso}"
            exit 1
          }
          echo "${boot}"
          grep -q 'El Torito boot img' <<<"${boot}" || {
            echo "::error::${iso} has no El Torito boot catalog"
            exit 1
          }
          xorriso -indev "${iso}" -ls /images/pxeboot 2>/dev/null | grep -q vmlinuz || {
            echo "::error::${iso} has no /images/pxeboot/vmlinuz (not an Anaconda installer)"
            exit 1
          }

          ( cd "${dir}" && sha256sum "my-fedora-iso-${VARIANT}.iso" > SHA256SUMS.txt )
          ( cd "${dir}" && sha256sum -c SHA256SUMS.txt )
          ls -lh "${dir}"

      - name: Upload ISO and checksum to job artifacts
        if: ${{ inputs['upload-to-s3'] != true && github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.variant }}-anaconda-iso
          path: artifacts/${{ matrix.variant }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          overwrite: true

      - name: Upload ISO and checksum to S3
        if: ${{ inputs['upload-to-s3'] == true && github.event_name != 'pull_request' }}
        shell: bash
        env:
          RCLONE_CONFIG_S3_TYPE: s3
          RCLONE_CONFIG_S3_PROVIDER: ${{ secrets.S3_PROVIDER }}
          RCLONE_CONFIG_S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          RCLONE_CONFIG_S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_S3_REGION: ${{ secrets.S3_REGION }}
          RCLONE_CONFIG_S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          SOURCE_DIR: artifacts/${{ matrix.variant }}
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone
          rclone copy "$SOURCE_DIR" S3:${{ secrets.S3_BUCKET_NAME }}

      - name: Clean up build output
        # Only reached after the ISO was uploaded
        run: |
          sudo rm -rf output
          sudo podman rmi -f "localhost/my-fedora-iso-${VARIANT}:latest" || true
