---
name: Validate

# Fast, read-only checks that run before the heavy image builds.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  sources:
    name: Shell, kickstart, units and workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Install podman, shellcheck and ISO tools
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y podman shellcheck xorriso

      - name: Check Justfile syntax
        run: just check

      - name: Validate sources
        run: bash build_files/validate.sh

  packages:
    name: Fedora package names
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install podman
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Resolve package lists in Fedora 44
        run: |
          set -euxo pipefail
          podman run --rm -v "$PWD:/repo:Z" -w /repo quay.io/fedora/fedora:44 \
            bash build_files/check-packages.sh
